server:
  port: 8080

spring:
  application:
    name: banking-app

  # === DATABASE ===
  # Development: dùng H2 in-memory
  # Production: đổi sang PostgreSQL
  datasource:
    url: jdbc:h2:mem:bankingdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop    # DEV only! Production dùng Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # === FLYWAY (tắt khi dùng H2 + ddl-auto) ===
  flyway:
    enabled: false

# === JWT ===
jwt:
  secret: bXktc3VwZXItc2VjcmV0LWtleS1mb3ItYmFua2luZy1hcHAtMjAyNA==
  expiration: 86400000   # 24 hours in milliseconds

# === LOGGING ===
logging:
  level:
    com.banking: DEBUG
    org.springframework.security: INFO

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate   # Production: chỉ validate, dùng Flyway migrate
    show-sql: false

  flyway:
    enabled: true
